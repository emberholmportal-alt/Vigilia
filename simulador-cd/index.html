<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Simulador CD — Operario de depósito</title>
<style>
  :root{--bg:rgba(14,18,24,.82);--line:rgba(255,255,255,.12);--txt:#e8edf2;--mut:#9aa6b2;--ok:#3ddc84;--warn:#ffcc33;--bad:#ff5555;--acc:#ff8a1f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1f24;color:var(--txt);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .panel{background:var(--bg);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(4px)}
  .hidden{display:none!important}
  button{font:inherit;color:var(--txt);background:#2a323c;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button:disabled{opacity:.45;cursor:default}
  #stats{position:fixed;top:calc(6px + env(safe-area-inset-top));left:6px;right:142px;padding:5px 8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
  #stats b{color:var(--txt);font-weight:600}
  #topBtns{position:fixed;top:calc(6px + env(safe-area-inset-top));right:6px;display:flex;gap:6px}
  #topBtns button{width:40px;height:34px;padding:0;font-size:17px}
  #rf{position:fixed;top:calc(46px + env(safe-area-inset-top));left:6px;width:min(330px,calc(100vw - 12px));max-height:44vh;display:flex;flex-direction:column;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .rf-head{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);color:#7fe0ff;letter-spacing:.5px}
  .rf-head button{padding:0 8px;height:22px}
  #rfBody{overflow:auto;padding:6px 8px}
  #orderInfo{color:var(--mut);margin-bottom:4px}
  .ln{display:grid;grid-template-columns:16px 52px 1fr auto;gap:4px;padding:3px 0;border-bottom:1px dashed var(--line);align-items:center}
  .ln.done{opacity:.45}.ln.next{color:#7fe0ff}
  .tag{font-size:10px;padding:0 4px;border-radius:4px;margin-left:3px}
  .t-fr{background:#5a1d1d;color:#ffb3b3}.t-q{background:#3d2a55;color:#e2c6ff}
  #hint{margin-top:6px;color:var(--warn)}
  #toasts{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:6px;align-items:center;pointer-events:none;width:min(420px,92vw);z-index:5}
  .toast{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--ok);padding:7px 10px;border-radius:8px;font-size:13px;width:100%;animation:tin .25s ease}
  .toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}
  @keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
  #joy{position:fixed;left:0;bottom:0;width:48vw;height:46vh;touch-action:none}
  #joyBase{position:absolute;left:calc(26px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
  #joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.28)}
  #actions{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #btnAct{min-width:150px;max-width:62vw;min-height:58px;font-size:15px;font-weight:600;background:var(--acc);color:#1a1006;border:0;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #btnAct:disabled{background:#3a434e;color:var(--mut);opacity:1}
  #btnAlt{min-height:40px}
  #wrapUI{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(52px + env(safe-area-inset-top));width:150px;padding:8px;display:flex;flex-direction:column;gap:6px}
  .wrap-title{font-weight:600;text-align:center}
  #covBars{display:flex;flex-direction:column-reverse;gap:2px}
  .cb{height:9px;background:#2a323c;border-radius:2px;position:relative}
  .cb i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
  .cb.top{outline:1px solid #7fe0ff}
  .cb.car{box-shadow:0 0 0 2px #fff}
  .wrap-btns{display:flex;gap:6px}.wrap-btns button{flex:1;height:48px;font-size:20px}
  #btnWrapDone{background:var(--ok);color:#06210f;border:0;font-weight:600;height:40px}
  #placeHelp{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;width:max-content;max-width:92vw;text-align:center}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
  .card{background:#151a20;border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:16px 18px;user-select:text}
  .card h1{font-size:20px;margin:0 0 4px}.card h2{font-size:15px;margin:14px 0 6px;color:var(--acc)}
  .card p,.card li{color:#c9d2db}.card ul{padding-left:18px;margin:4px 0}
  .card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .card .big{background:var(--acc);color:#1a1006;border:0;font-weight:700;padding:10px 16px;font-size:15px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px}
  .score{font-size:40px;font-weight:800}
  .inc{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .inc span:last-child{color:var(--bad);white-space:nowrap}
  kbd{background:#2a323c;border-radius:4px;padding:0 5px;border:1px solid var(--line)}
  @media (min-width:900px){#joy{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="stats" class="panel"></div>
  <div id="topBtns"><button id="btnManual" title="Manual">📘</button><button id="btnFp" title="Primera persona en las acciones (V)">👁</button><button id="btnCam" title="Rotar cámara (R)">⟲</button></div>
  <div id="rf" class="panel">
    <div class="rf-head"><span>📟 TERMINAL RF</span><button id="rfToggle">–</button></div>
    <div id="rfBody"><div id="orderInfo"></div><div id="lines"></div><div id="hint"></div></div>
  </div>
  <div id="toasts"></div>
  <div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="actions"><button id="btnAlt" class="hidden">Cancelar</button><button id="btnAct" disabled>—</button></div>
  <div id="wrapUI" class="panel hidden">
    <div class="wrap-title">🌀 Envolvedora</div>
    <div id="covBars"></div>
    <div style="font-size:11px;color:var(--mut)">Base ≥3 vueltas · carga ≥2</div>
    <div class="wrap-btns"><button id="btnUp">▲</button><button id="btnDown">▼</button></div>
    <button id="btnWrapDone">Terminar</button>
  </div>
  <div id="placeHelp" class="hidden">Tocá una posición sobre el pallet · <b style="color:#3ddc84">verde</b> OK · <b style="color:#ffcc33">amarillo</b> advertencia · <b style="color:#ff5555">rojo</b> incumple</div>
</div>
<div id="modal"><div class="card" id="modalCard"><h1>Cargando…</h1><p>Preparando el depósito…</p></div></div>

<h2>C\xF3mo trabaja un CD en Argentina (resumen)</h2>
<ul>
<li><b>Pallet ARLOG 1000\xD71200 mm</b>: el est\xE1ndar argentino (Asociaci\xF3n Argentina de Log\xEDstica Empresarial). Madera, ~22 kg, ~1.000 kg de carga din\xE1mica. La altura del pallet armado la fija el cliente o el transporte; en el simulador, <b>1,60 m</b> con pallet.</li>
<li><b>Ubicaciones</b>: Pasillo/Fila \u2013 Columna \u2013 Nivel (ej. <code>A-03-0</code>). El <b>nivel 0</b> es picking a mano; los niveles superiores son <b>pulm\xF3n</b> (reserva) y solo los opera el autoelevadorista.</li>
<li><b>Picking por pedido</b> con terminal RF: escane\xE1s la ubicaci\xF3n y el bulto (EAN-13 / DUN-14); la terminal valida producto y cantidad.</li>
<li><b>Reposici\xF3n</b>: cuando el picking llega al m\xEDnimo, se baja un pallet del pulm\xF3n. Alimentos/bebidas: <b>FEFO</b> (vence primero, sale primero). Otros: FIFO.</li>
</ul>
<h2>Reglas de armado</h2>
<ul>
<li>Lo <b>pesado y resistente abajo</b>, lo <b>liviano y fr\xE1gil arriba</b> (vino, galletitas, papas).</li>
<li>Respet\xE1 la <b>resistencia a la compresi\xF3n</b> de cada caja ("apilar m\xE1x. X kg").</li>
<li><b>Nunca</b> productos de limpieza o qu\xEDmicos <b>sobre</b> alimentos (derrames/contaminaci\xF3n; C\xF3digo Alimentario Argentino y BPM). Si van en el mismo pallet: abajo o separados.</li>
<li>Capas <b>parejas</b>, sin torres; nada sobresale del borde del pallet; centro de gravedad al medio.</li>
</ul>
<h2>Enfilmado (film stretch)</h2>
<ul>
<li>Film de ~50 cm de ancho. Arranc\xE1 <b>abajo</b>: <b>3 vueltas en la base</b> abrazando el pallet (si no, la carga desliza sobre la madera).</li>
<li>Sub\xED con ~50% de solapamiento: <b>2 vueltas en toda la altura</b> y reforz\xE1 arriba. M\xE1s vueltas no siempre es mejor: es costo y residuo.</li>
</ul>
<h2>Seguridad e higiene</h2>
<ul>
<li>Ley 19.587 y Dto. 351/79; ergonom\xEDa y levantamiento manual: Res. MTEySS 295/03 (Anexo I). Dobl\xE1 las rodillas, carga pegada al cuerpo, sin girar el tronco.</li>
<li>EPP: calzado de seguridad, chaleco reflectivo, guantes.</li>
<li>Con el autoelevador operando, <b>no entres al pasillo</b> (zona roja). Peat\xF3n y autoelevador no comparten espacio.</li>
<li>Con la zorra: arranc\xE1, fren\xE1 y dobl\xE1 suave; mir\xE1 siempre hacia donde vas.</li>
</ul>
<h2>Despacho</h2>
<ul><li>El pallet sale con <b>remito</b>; en provincia de Buenos Aires el traslado lleva <b>COT</b> (ARBA).</li></ul>
